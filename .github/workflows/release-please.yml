# Release Please — changelog and version automation.
#
# release-please turns Conventional Commits into a version bump, a CHANGELOG
# entry, and a "chore(release): vX.Y.Z" pull request. Merging that PR is the
# ONLY sanctioned way a commit reaches `main` from `develop`, which makes it
# the single promotion gate for production.
#
# Flow:
#   1. Push to `develop`.
#   2. release-please scans commits since the last `v*` tag.
#   3. If any of them warrant a SemVer bump it opens (or updates) the
#      release PR targeting `main`, bumping:
#        - CHANGELOG.md
#        - package.json                       ($.version)
#        - src-tauri/Cargo.toml               ($.package.version)
#        - src-tauri/tauri.conf.json          ($.version)
#      All four rules live in `release-please-config.json`.
#   4. CODEOWNER approves + merges the release PR into `main`.
#   5. release-please tags the merge commit `vX.Y.Z`.
#   6. The `v*` tag push triggers release.yml -> signed bundles + GitHub
#      Release.
#
# NOTE ON v4 CONFIGURATION
# release-please-action v4 REMOVED the `package-name`, `default-branch`,
# `changelog-path`, `changelog-sections` and `extra-files` inputs. Passing
# them produces only a warning —
#
#   [warning]Unexpected input(s) 'package-name', 'default-branch',
#   'changelog-path', 'changelog-sections', 'extra-files', valid inputs are...
#
# — and they are then silently ignored. Worse, the multi-line changelog
# sections scalar survives YAML parsing but fails the action's own parse
# ("unexpected token ' ' at 1:8"), which fails the step.
#
# v4 reads configuration from `release-please-config.json` +
# `.release-please-manifest.json` instead. Do not inline any of those
# settings back into this workflow; add them to the config file.
#
# IMPORTANT: both files are read from the TARGET branch, not from the ref
# being scanned. With `target-branch: main` that means they must exist on
# `main`. If they only exist on `develop` the action fails with:
#
#   base (functionfly/vault-desktop): Missing required manifest config:
#   release-please-config.json
#
# even though the files are present in the checkout. They are repo config,
# not unreleased code, so `main` is the right place for them — see the
# one-time step in docs/BRANCHING.md.
#
# Spec: https://github.com/googleapis/release-please
name: Release Please

on:
  push:
    # `branches` and `branches-ignore` are mutually exclusive for the same
    # event in GitHub Actions -- using both makes GitHub reject the whole
    # file (the run fails in 0s with "workflow file issue" and creates no
    # jobs). Negate the release PR branch inside `branches` instead; `**` is
    # used because `*` does not match `/`.
    branches:
      - develop
      - "!release-please--**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel: a cancelled half-run leaves the release PR in a state only
  # a human can untangle.
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT, not GITHUB_TOKEN.
          #
          # This repository sits under an enterprise policy that forbids the
          # Actions token from creating pull requests:
          #
          #   The enterprise does not allow GitHub Actions to create or
          #   approve pull requests
          #
          # and `PUT /actions/permissions/workflow` refuses both
          # `default_workflow_permissions: write` and
          # `can_approve_pull_request_reviews: true` with a 409. Without a
          # PAT this workflow fails with:
          #
          #   GitHub Actions is not permitted to create or approve pull
          #   requests.
          #
          # `release-please-bot@...` is the token to store here. It needs
          # `contents: write` and `pull-requests: write`, and it bypasses
          # the enterprise restriction because it is not GITHUB_TOKEN.
          #
          # Until that secret exists the step fails loudly by design. Do not
          # add `continue-on-error` here: a release pipeline that cannot open
          # its PR is not a release pipeline, and silently succeeding would
          # mean releases stop being cut with no signal.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

          # The v4 config surface. Paths are relative to the repo root.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

          # The release PR targets `main`; `develop` is only the source of
          # the commits being evaluated. The trigger above is set to develop.
          target-branch: main

      - name: Report when the PAT is missing
        # Distinguishes "no PAT configured" from "PAT present but lacks
        # scope", which look identical in the action's own error text.
        if: failure()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### release-please could not run

          This repository is under an enterprise policy that blocks
          `GITHUB_TOKEN` from creating pull requests, so release-please
          cannot open the release PR.

          Fix: add a `RELEASE_PLEASE_TOKEN` secret holding a token with
          `contents: write` and `pull-requests: write` (a
          `release-please-bot@...` fine-grained token is the usual choice).

          Until then, releases are cut by hand — see docs/BRANCHING.md.
          EOF

      - name: Summarise release state
        if: always()
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          {
            echo "### release-please"
            echo ""
            if [ -n "$TAG" ]; then
              echo "Tagged $TAG -- release.yml will build the signed bundles."
            elif [ -n "$PR" ]; then
              echo "Release PR updated: $PR"
              echo ""
              echo "Review the CHANGELOG diff. A feat filed as a fix ships a"
              echo "release that under-reports what changed."
            else
              echo "Nothing to release. Commits since the last tag were"
              echo "docs/chore/ci/test only, which do not move the version."
            fi
          } >> "$GITHUB_STEP_SUMMARY"