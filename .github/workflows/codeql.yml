# CodeQL — static analysis for both languages in the vault.
#
# The Rust core holds the crypto primitives and the HTTP client that carries
# the bearer token, so it is the surface that matters most. The TypeScript
# layer is the untrusted webview: it parses orchestrator responses and must
# never be trusted to reach the keychain directly.
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, Monday 05:32 UTC. Off the hour to avoid the GitHub Actions
    # scheduling congestion at :00.
    - cron: '32 5 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-rust:
    name: Analyze Rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri deps
        # `autobuild` links the crate, which requires the GTK / WebKitGTK /
        # keyring-dbus system libraries to be present.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsecret-1-dev

      - uses: github/codeql-action/init@v3
        with:
          languages: rust
          # `none`, NOT `autobuild`. Rust has no CodeQL extractor shim that
          # autobuild knows how to invoke, so `build-mode: autobuild` fails at
          # `database init` with:
          #   "A fatal error occurred: Rust does not support the autobuild
          #    build mode. Please try using one of the following build modes
          #    instead: none."
          # `none` analyses the source tree without compiling. For this crate
          # that loses nothing material: the crypto primitive calls are all
          # library calls into audited aes-gcm/pbkdf2/sha2, and the
          # taint-relevant logic (HTTP header assembly in api.rs, zeroizing in
          # store.rs) is plain Rust the extractor handles from source.
          #
          # If a future version adds proc macros that need expansion for
          # accuracy, switch to `build-mode: manual` and point `build` at
          # `cargo build --all-targets` under src-tauri.
          build-mode: none
          config-file: ./.github/codeql/config.yml

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:rust
          # The repository is private and does not have GitHub Advanced
          # Security / Code Security enabled, so `analyze` cannot upload a
          # SARIF and fails with:
          #   "Code Security must be enabled for this repository to use code
          #    scanning."
          # That is a repository *setting* (Settings -> Code security and
          # analysis -> Enable), not something a workflow can grant itself.
          #
          # continue-on-error keeps the pipeline green until someone enables
          # it, and the notice below makes the gap visible on every run
          # instead of silently disabling coverage. When Code Security is
          # turned on, delete continue-on-error and the following step.
          continue-on-error: true

      - name: Warn that results are not being uploaded
        if: always()
        shell: bash
        run: |
          {
            echo "### CodeQL — Rust"
            echo ""
            echo "Analysis ran, but results are **not uploaded** unless Code"
            echo "Security is enabled for this repository."
            echo ""
            echo "Settings -> Code security and analysis -> Enable. Free for"
            echo "public repos; private repos need GitHub Advanced Security."
          } >> "$GITHUB_STEP_SUMMARY"

  analyze-javascript:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # `none` is correct here: the webview is a plain TS/Vite project with
          # no framework-specific build for CodeQL to observe, so letting
          # autobuild guess adds several minutes and no coverage. (It also
          # emits a harmless "Skipping path node_modules, which does not
          # exist" because the TypeScript job never installs deps.)
          build-mode: none
          config-file: ./.github/codeql/config.yml

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
          # Same reason as the Rust job: Code Security is not enabled, so the
          # SARIF upload fails. See the note there.
          continue-on-error: true

      - name: Warn that results are not being uploaded
        if: always()
        shell: bash
        run: |
          {
            echo "### CodeQL — TypeScript"
            echo ""
            echo "Analysis ran, but results are **not uploaded** unless Code"
            echo "Security is enabled for this repository."
          } >> "$GITHUB_STEP_SUMMARY"