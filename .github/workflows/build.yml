name: vault-desktop
on:
  push:
    branches: [main]
  pull_request:

# Same Tauri prerequisites that studio-desktop uses; matches
# https://tauri.app/start/prerequisites/.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        # `cargo tauri build` needs the CLI binary; the Rust toolchain alone
        # does not provide it. Without this the step fails with
        # "no such command: `tauri`".
        run: cargo install tauri-cli --version "^2" --locked

      - name: Cache Rust deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Node + bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Linux Tauri deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: JS install + tsc + vite build
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bunx vite build

      - name: Rust check + tests
        working-directory: src-tauri
        run: |
          cargo check --all-targets
          cargo test --lib
          # Integration tests mock the orchestrator; they prove the
          # HTTP+CSRF contract without needing a real staging server.
          cargo test --test orchestrator_mock

      - name: React IPC contract tests
        run: bunx vitest run

      - name: Smoke script syntax check
        # The smoke script gates the v0.1.0 production merge and must be
        # exercised manually against a real orchestrator before merge.
        # CI only verifies that the shell parses cleanly and uploads it
        # as a build artifact so reviewers can run it as-is.
        run: |
          bash -n scripts/staging-smoke.sh
          shellcheck scripts/staging-smoke.sh || true   # best-effort

      - name: Upload smoke script + last 200 lines of integration test
        uses: actions/upload-artifact@v4
        with:
          name: vault-desktop-smoke-${{ matrix.os }}
          path: |
            scripts/staging-smoke.sh
          if-no-files-found: ignore

      - name: Build bundle
        working-directory: src-tauri
        run: cargo tauri build
        env:
          # Skip bundling on CI to keep the matrix runtime reasonable; the
          # cargo tauri build call still exercises the full code path
          # without producing installers.
          TAURI_SKIP_BUNDLE: "true"
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: vault-desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/functionfly-vault-desktop*
            src-tauri/target/release/bundle/
          if-no-files-found: ignore
