# Continuous integration for vault-desktop.
#
# Branching contract (see docs/BRANCHING.md):
#   feature/* , fix/* , chore/*  ->  develop   (validated by branch-flow.yml)
#   develop                       ->  main     (via the release-please PR)
#   hotfix/*                      ->  main     (back-merged into develop)
#
# This workflow runs on every push to either long-lived branch and on every
# PR targeting them. It never needs a signing key: packaging is suppressed
# with `--no-bundle` (see the note on that step for why TAURI_CONFIG does not
# work). Signed bundles are built exclusively by release.yml on a `v*` tag.
name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      # Documentation-only changes cannot break the build, the tests or
      # the release scripts. Skipping them saves a full run on every
      # README tweak.
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  # Required so Dependabot-authored PRs still get a status check from this
  # workflow on `pull_request` events from forks.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast gates ────────────────────────────────────────────────────────────
  # Everything here runs on a single runner and completes in ~1 min, so it
  # gives authors a fast red/green before the 3-OS matrix starts.
  frontend:
    name: frontend (tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: IPC contract tests
        # Every typed wrapper in src/lib/ipc.ts asserts its (command, args)
        # shape and its typed {kind, message} rejection envelope.
        run: bunx vitest run

      - name: Production webview bundle
        run: bunx vite build

  rust:
    name: rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri deps
        # Required for `cargo check --all-targets` to link against the GTK /
        # WebKitGTK / keyring-dbus system libraries.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsecret-1-dev

      - name: cargo fmt --check
        working-directory: src-tauri
        # This gate is real, not advisory: the tree was rustfmt-clean as of
        # commit df6b88b. Reformatting the crate was a deliberate one-off
        # (the initial import had never been formatted), so this only fails
        # when a genuinely unformatted change is introduced.
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        # Blocking as of 2026-11-03. The warning baseline in src/api.rs,
        # src/store.rs, src/crypto.rs and src/commands/mod.rs has been
        # cleaned up, so `-D warnings` is a real gate: a new lint is a
        # red build rather than a line in the log.
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (unit + integration)
        working-directory: src-tauri
        # `--lib` covers the crypto/updater unit tests.
        # `--test orchestrator_mock` covers the mockito integration tests
        # that prove the HTTP + CSRF contract without a real orchestrator.
        # `--test updater_config` proves the updater's verification key is
        # present and parseable in the shipped configuration.
        # `--test keychain_smoke` exercises the real OS credential store.
        # It skips with a notice on a headless runner (no Secret Service),
        # and fails hard on macOS/Windows, where a keychain always exists.
        # `--test published_artifact_contract` fetches the LIVE stable
        # manifest and the artefact it points at, and verifies the
        # signature against the key compiled into the binary. It skips
        # with a notice when the CDN is unreachable.
        run: |
          cargo test --lib
          cargo test --test orchestrator_mock
          cargo test --test device_flow
          cargo test --test updater_config
          cargo test --test keychain_smoke
          cargo test --test published_artifact_contract

  # ── macOS compile gate ────────────────────────────────────────────────────
  # Type-checks the macOS build on a Linux runner.
  #
  # This is a COMPILE GATE, not a build: it produces no .app and no .dmg.
  # It exists because the `macos-latest` job in the build matrix below
  # cannot start while the organisation's GitHub billing is unsettled.
  # Without this gate, a macOS-only compile error would sit unnoticed
  # until a macOS runner finally exists.
  #
  # It needs `zig` (which bundles the macOS libc headers and emits
  # Mach-O objects) and LLVM's `llvm-install-name-tool` (which CMake
  # demands as soon as CMAKE_SYSTEM_NAME=Darwin). See
  # scripts/macos-typecheck.sh for the full explanation.
  macos:
    name: macos (compile gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache zig
        # The tarball is 55 MB. The cache key is the Zig version — not
        # the commit — because the toolchain does not change with the
        # repository.
        uses: actions/cache@v4
        with:
          path: ~/.local/zig
          key: zig-0.17.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install zig
        # Zig bundles the macOS libc headers, so `zig cc` can compile the
        # C dependencies (ring, aws-lc-sys) for macOS on Linux.
        #
        # The cache step above restores it; this step is the fallback
        # for a cold cache.
        env:
          ZIG_VERSION: 0.17.1
        run: |
          set -euo pipefail
          ZIG_ROOT="$HOME/.local/zig"
          if [ -x "$ZIG_ROOT/zig" ] && "$ZIG_ROOT/zig" version | grep -q "$ZIG_VERSION"; then
            echo "zig $ZIG_VERSION is already installed (restored from cache)."
          else
            curl -sSL --max-time 600 \
              "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
              -o /tmp/zig.tar.xz
            rm -rf "$ZIG_ROOT"
            mkdir -p "$HOME/.local"
            tar -xJf /tmp/zig.tar.xz -C "$HOME/.local" --strip-components=1
            mv "$HOME/.local/zig-x86_64-linux-${ZIG_VERSION}" "$ZIG_ROOT"
          fi
          echo "$ZIG_ROOT" >> "$GITHUB_PATH"

      - name: Install LLVM
        # llvm-install-name-tool is LLVM's build of Apple's
        # install_name_tool. CMake requires it for a Darwin build.
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 cmake
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: macOS compile gate
        run: bash scripts/macos-typecheck.sh

  # ── Cross-platform compile matrix ─────────────────────────────────────────
  # Proves the crate compiles and the webview bundles on every shipping OS.
  #
  # COST. A macOS runner costs 10x a Linux one and a Windows runner 2x, so
  # the three-OS matrix is the most expensive thing in this repository.
  # It runs ONLY on a push to `main` — the branch that holds released,
  # tagged code — and on a release tag. A pull request gets the Linux
  # leg alone, which is enough to catch the mistakes that actually
  # happen (a type error, a failing test, a broken script).
  #
  # The macOS leg is not lost: the `macos` job above type-checks the
  # macOS build on a LINUX runner, so macOS compile errors are caught on
  # every push for the price of a Linux minute. The multi-OS matrix is
  # about link-time and bundler differences, not about whether the code
  # compiles.
  build:
    name: build (${{ matrix.os }})
    needs: [frontend, rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Linux Tauri deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsecret-1-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build webview bundle
        run: bunx vite build

      - name: Compile Rust binary (no packaging)
        working-directory: src-tauri
        # `bunx tauri`, not `cargo tauri`: @tauri-apps/cli is already a
        # devDependency, so the binary is on PATH from `bun install`. Using
        # `cargo tauri` here would require `cargo install tauri-cli`, which
        # recompiles the whole CLI from source on every runner (~4 min of
        # cache-cold overhead per matrix leg) for the same result.
        #
        # `--no-bundle` compiles the binary without producing installers.
        #
        # Do NOT try to suppress packaging with TAURI_CONFIG. All three CI
        # runners received
        # `{"bundle":{"active":false,"createUpdaterArtifacts":false}}` and
        # still produced 2-3 bundles before failing on the missing
        # TAURI_SIGNING_PRIVATE_KEY. Tauri's JSON config override is not
        # honoured for these bundle flags in v2; the CLI flag is the
        # supported mechanism.
        #
        # The Ed25519 signing key is deliberately absent from this workflow —
        # release.yml is the only job that ever sees it.
        run: bunx tauri build --no-bundle

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vault-desktop-${{ matrix.os }}
          path: src-tauri/target/release/functionfly-vault-desktop*
          if-no-files-found: warn
          retention-days: 14

  # ── Release-script harness ────────────────────────────────────────────────
  # The publish-update.sh path is the operator-host contract that CI must not
  # silently drift away from, so it is parsed and its self-tests are run here.
  release-scripts:
    name: release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        # `shell: bash` is required on windows-latest; PowerShell cannot run
        # `bash -n` at all. Declared on the workflow job rather than per-step
        # so it is uniform across platforms.
        shell: bash
        run: |
          bash -n scripts/staging-smoke.sh
          bash -n scripts/check-no-internal-leaks.sh
          for f in scripts/release/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/release/render-manifest.py
          python3 -m py_compile scripts/release/updater-targets.py
          python3 -m py_compile scripts/release/mock-r2.py

      - name: Release helper scripts are executable
        # CI invokes several scripts directly (`./scripts/…`). A script
        # committed without the executable bit fails with exit 126
        # ("permission denied") before a single line of it runs, which
        # looks like a broken script rather than a broken file mode.
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r script; do
            mode="$(git ls-files -s "$script" | awk '{print $1}')"
            if [ "$mode" != "100755" ]; then
              echo "::error::${script} is committed with mode ${mode}; it must be 100755."
              echo "  fix: git update-index --chmod=+x ${script}"
              failed=1
            fi
          done < <(git ls-files 'scripts/*.sh' 'scripts/*.py' 'scripts/**/*.sh' 'scripts/**/*.py')
          exit "$failed"

      - name: No internal-only material in publishable files
        # The guard checks the whole tree against two layers:
        #
        #   1. Generic secret SHAPES (private key blocks, cloud token
        #      formats). These live in the script itself — they are
        #      patterns, not values.
        #   2. This project's SPECIFIC identifiers (the R2 account id, the
        #      R2 access key id, the updater key fingerprint, the build
        #      host's home path, the owner handles). These are NOT in the
        #      repository — the file containing them is git-ignored, so
        #      publishing the guard does not publish the answer. CI writes
        #      them out from the `INTERNAL_IDENTIFIERS` secret.
        #
        # If the secret is absent, layer 2 is skipped and the script says
        # so loudly rather than passing silently.
        #
        # CHANGELOG.md is included in the scan because its section is
        # copied verbatim into the GitHub release notes.
        shell: bash
        env:
          INTERNAL_IDENTIFIERS: ${{ secrets.INTERNAL_IDENTIFIERS }}
        run: |
          if [ -n "$INTERNAL_IDENTIFIERS" ]; then
            printf '%s' "$INTERNAL_IDENTIFIERS" > .internal-identifiers.local
          else
            echo "::warning::the INTERNAL_IDENTIFIERS secret is not set — layer 2 of the leak guard was skipped"
          fi
          ./scripts/check-no-internal-leaks.sh

      - name: shellcheck (best-effort)
        # Non-blocking: the upstream scripts predate shellcheck-clean and the
        # findings are advisory, not release-blocking.
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/staging-smoke.sh || true
          shellcheck scripts/release/*.sh || true

      - name: publish-update.sh self-tests
        # Arg-parsing smoke plus the updater manifest contract: the
        # manifest must be valid JSON, keyed by a target the plugin can
        # look up, carry the .sig CONTENT (not a URL to it), and merge
        # correctly across platforms. Those assertions need only
        # python3, so they run on every CI run.
        #
        # The end-to-end round-trip against the bundled mock-r2.py needs
        # the AWS CLI as well, which the ubuntu-24.04 runner does not
        # provide via apt:
        #   E: Package 'awscli' has no installation candidate
        # It therefore stays inert here and is exercised on the operator
        # host (or in a runner with the v2 CLI installed).
        #
        # openssh-client provides `ssh-keygen`, which the env-loader check
        # uses to build a throwaway keypair so the test does not depend on a
        # real signing key existing on the runner.
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 openssh-client
          ./scripts/release/publish-update.test.sh

      - name: Assert the updater keypair matches
        # The updater's verification key lives in `plugins.updater.pubkey`
        # (tauri.conf.json) while release artefacts are signed with
        # `TAURI_SIGNING_PRIVATE_KEY`. If those two drift apart, the
        # release still builds and every update fails signature
        # verification on a user's machine.
        #
        # Without a signing key the script still asserts the configured
        # pubkey is present and well-formed, so an empty pubkey — which
        # would break the release build at the signing step — is caught
        # here too.
        shell: bash
        run: ./scripts/release/verify-updater-keypair.sh

      - name: Staging smoke script against a mock orchestrator
        # `scripts/staging-smoke.sh` is the manual pre-merge gate against
        # a real orchestrator. It had never been run against anything, so
        # this drives the REAL script against a mock that ENFORCES the
        # bearer + CSRF contract. A green run means the script speaks the
        # protocol, not that a permissive mock let it through.
        shell: bash
        run: bash scripts/staging-smoke.test.sh

      - name: Code-signing readiness
        # Reports whether this host could produce a signed installer.
        # Advisory by default: the `APPLE_*` / `WINDOWS_CERTIFICATE*`
        # secrets are optional in the release pipeline. Set the
        # repository variable `REQUIRE_CODE_SIGNING=true` to make an
        # unsigned artefact fail instead of being reported.
        shell: bash
        run: bash scripts/release/check-signing-readiness.sh

      - name: Publish smoke script
        # `scripts/staging-smoke.sh` is still the manual pre-merge gate for a
        # real-staging run: the headless CI runner has no OS keychain, so the
        # three-platform keychain check can only be done by a human.
        uses: actions/upload-artifact@v4
        with:
          name: vault-desktop-smoke-script
          path: scripts/staging-smoke.sh
          if-no-files-found: warn
          retention-days: 30

  # ── Portable runner ───────────────────────────────────────────────────────
  # The same gates as the jobs above, executed by `scripts/ci.sh` instead of
  # by the Actions runtime. It exists so the gate set is not owned by
  # GitHub: the script runs on any machine with bun + cargo + python3, and
  # in the container in `scripts/ci/Dockerfile`.
  #
  # It is NOT a second, weaker gate — it runs the identical steps, and
  # `--check-parity` fails the job if the two drift apart.
  #
  # COST. This job runs the WHOLE gate set, so on a pull request it
  # duplicates the `frontend` and `rust` jobs that already ran: two
  # full compiles of the same tree. It therefore runs on a push to
  # `main` only, plus on a manual dispatch.
  #
  # That is consistent with how this repository actually gates a merge:
  # the portable runner IS the gate (see the README), and it is run by
  # hand on the operator's machine, where it publishes the `portable CI`
  # status the branch protection requires. This workflow's job is the
  # belt-and-braces proof that the two have not drifted — a job that
  # needs no pull request to be useful.
  portable-runner:
    name: portable runner
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsecret-1-dev patchelf python3

      - name: Run the portable gate set
        run: bash scripts/ci.sh --report

      - name: Check the runner and ci.yml have not drifted
        run: CHECK_PARITY=1 bash scripts/ci.sh --job release_scripts